    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Event",
        "name": "JLPT 2026 日本語能力試験",
        "description": "2026年7月5日（日）に実施される日本語能力試験（JLPT）のカウントダウン。",

  <body>
    <div class="fog-wrap" aria-hidden="true">
      <div class="fog-band fog-a"></div>
      <div class="fog-band fog-b"></div>
      <div class="fog-band fog-c"></div>
      <div class="fog-band fog-d"></div>
      <div class="fog-band fog-e"></div>
    </div>

    <main class="page-shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="language-ribbon" aria-label="日本語能力試験">
          <span>日本語能力試験</span>
          <span>令和八年</span>
        </div>

        <div class="hero-content">
          <p class="eyebrow">2026年7月5日・日曜日</p>
          <h1 id="page-title">JLPT 2026<br />夏の試験まで</h1>
          <p class="lead">
            一日一日を大切に。合格へ向かう静かな集中を、今日から積み重ねましょう。
          </p>

          <div class="countdown" aria-live="polite">
            <div class="time-block">
              <strong id="days">000</strong>
              <span>日</span>
            </div>
            <div class="time-block">
              <strong id="hours">00</strong>
              <span>時間</span>
            </div>
            <div class="time-block">
              <strong id="minutes">00</strong>
              <span>分</span>
            </div>
            <div class="time-block">
              <strong id="seconds">00</strong>
              <span>秒</span>
            </div>
          </div>

          <p id="status-message" class="status-message">
            試験日まで、学びの歩みは続いています。
          </p>
          <p id="tz-local" class="tz-local" hidden></p>
        </div>

        <aside class="info-panel" aria-label="試験情報">
          <div>
            <span>試験日</span>
            <strong>2026年7月5日</strong>
          </div>
          <div>
            <span>曜日</span>
            <strong>日曜日</strong>
          </div>
          <div>
            <span>目標</span>
            <strong>合格をつかむ</strong>
          </div>
        </aside>
      </section>
    </main>

    <div class="tz-fab-wrap" id="tz-fab-wrap">
      <div class="tz-panel" id="tz-panel" hidden>
        <p class="tz-panel-head">⛩ タイムゾーン</p>
        <ul class="tz-list" id="tz-list" role="listbox" aria-label="タイムゾーン選択"></ul>
      </div>
      <button class="tz-fab" id="tz-btn" aria-label="タイムゾーンを変更" aria-expanded="false">
        <svg viewBox="0 0 20 20" width="20" height="20" fill="currentColor" aria-hidden="true">
          <rect x="4" y="5" width="2.5" height="15" rx="1"/>
          <rect x="13.5" y="5" width="2.5" height="15" rx="1"/>
          <rect x="3" y="9" width="14" height="2.5" rx="1"/>
          <rect x="0" y="3" width="20" height="3.5" rx="1.5"/>
        </svg>
        <span class="tz-fab-label">時間帯</span>
      </button>
    </div>
