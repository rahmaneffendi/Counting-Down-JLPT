<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JLPT 2026 カウントダウン</title>
    <meta
      name="description"
      content="2026年7月5日に実施される日本語能力試験までのカウントダウン。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="hero" aria-labelledby="page-title">
        <div class="language-ribbon" aria-label="日本語能力試験">
          <span>日本語能力試験</span>
          <span>令和八年</span>
        </div>

        <div class="hero-content">
          <p class="eyebrow">2026年7月5日・日曜日</p>
          <h1 id="page-title">JLPT 2026<br />夏の試験まで</h1>
          <p class="lead">
            一日一日を大切に。合格へ向かう静かな集中を、今日から積み重ねましょう。
          </p>

          <div class="countdown" aria-live="polite">
            <div class="time-block">
              <strong id="days">000</strong>
              <span>日</span>
            </div>
            <div class="time-block">
              <strong id="hours">00</strong>
              <span>時間</span>
            </div>
            <div class="time-block">
              <strong id="minutes">00</strong>
              <span>分</span>
            </div>
            <div class="time-block">
              <strong id="seconds">00</strong>
              <span>秒</span>
            </div>
          </div>

          <p id="status-message" class="status-message">
            試験日まで、学びの歩みは続いています。
          </p>
        </div>

        <aside class="info-panel" aria-label="試験情報">
          <div>
            <span>試験日</span>
            <strong>2026年7月5日</strong>
          </div>
          <div>
            <span>曜日</span>
            <strong>日曜日</strong>
          </div>
          <div>
            <span>目標</span>
            <strong>合格をつかむ</strong>
          </div>
        </aside>
      </section>
    </main>

    <footer class="site-footer">
      <a href="https://lazwan.com" target="_blank" rel="noopener noreferrer">
        Designed by Lazwan Digital Studio
      </a>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
